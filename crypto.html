<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crypto — PulseStock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F8FAFC;--surface:#fff;--border:#E2E8F0;--text:#0F172A;
  --text2:#475569;--text3:#94A3B8;--blue:#1A6BF5;--green:#16A34A;
  --red:#DC2626;--green-bg:#F0FDF4;--red-bg:#FEF2F2;
}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}

/* NAV */
.nav{background:#fff;border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100;}
.nav-left{display:flex;align-items:center;gap:20px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.nav-logo-icon{width:28px;height:28px;background:var(--blue);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;}
.nav-logo-name{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.4px;}
.nav-logo-name span{color:var(--blue);}
.nav-back{font-size:13px;color:var(--text2);text-decoration:none;padding:6px 12px;border-radius:7px;border:1px solid var(--border);transition:all .15s;}
.nav-back:hover{border-color:var(--blue);color:var(--blue);}
.nav-search{display:flex;gap:6px;}
.nav-input{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-size:13px;font-family:'Inter',sans-serif;color:var(--text);outline:none;width:160px;}
.nav-input:focus{border-color:var(--blue);}
.nav-btn{background:var(--blue);color:#fff;border:none;border-radius:7px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
.nav-btn:hover{background:#1558D6;}

/* HERO */
.hero{max-width:1100px;margin:0 auto;padding:32px 24px 0;}
.loading-state{text-align:center;padding:80px 24px;color:var(--text3);font-size:15px;}
.coin-header{display:flex;align-items:flex-start;gap:20px;margin-bottom:24px;}
.coin-icon{width:56px;height:56px;border-radius:14px;object-fit:contain;flex-shrink:0;background:var(--bg);border:1px solid var(--border);}
.coin-icon-placeholder{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#F59E0B,#EA580C);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;flex-shrink:0;}
.coin-info{flex:1;}
.coin-name-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
.coin-name{font-size:28px;font-weight:800;letter-spacing:-.5px;}
.coin-sym{font-size:14px;font-weight:600;color:var(--text3);background:var(--bg);border:1px solid var(--border);padding:3px 8px;border-radius:6px;}
.coin-rank{font-size:12px;font-weight:600;color:var(--text3);background:var(--bg);border:1px solid var(--border);padding:3px 8px;border-radius:6px;}
.coin-price-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.coin-price{font-size:36px;font-weight:800;letter-spacing:-1px;font-family:'JetBrains Mono',monospace;}
.coin-chg{font-size:16px;font-weight:600;padding:4px 10px;border-radius:8px;}
.coin-chg.up{color:var(--green);background:var(--green-bg);}
.coin-chg.dn{color:var(--red);background:var(--red-bg);}
.coin-updated{font-size:11px;color:var(--text3);margin-top:4px;}

/* GRID */
.main-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;max-width:1100px;margin:0 auto;padding:0 24px 40px;}

/* CHART */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.chart-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.chart-title{font-size:14px;font-weight:600;}
.chart-periods{display:flex;gap:4px;}
.period-btn{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text3);font-family:'Inter',sans-serif;transition:all .15s;}
.period-btn.active{background:var(--blue);color:#fff;}
.period-btn:hover:not(.active){background:var(--bg);color:var(--text);}

/* STATS CARDS */
.stats-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;}
.stats-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F8FAFC;font-size:13px;}
.stat-row:last-child{border-bottom:none;}
.stat-label{color:var(--text2);}
.stat-val{font-weight:600;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;}
.stat-val.up{color:var(--green);}
.stat-val.dn{color:var(--red);}

/* ABOUT */
.about-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:16px;}
.about-title{font-size:13px;font-weight:700;margin-bottom:10px;}
.about-text{font-size:13px;color:var(--text2);line-height:1.7;}
.about-links{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.about-link{font-size:12px;font-weight:600;color:var(--blue);text-decoration:none;padding:4px 10px;border:1px solid #BFDBFE;border-radius:6px;background:#EFF6FF;transition:all .15s;}
.about-link:hover{background:#DBEAFE;}

/* PERF BARS */
.perf-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:16px;}
.perf-title{font-size:13px;font-weight:700;margin-bottom:14px;}
.perf-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;}
.perf-label{width:36px;color:var(--text3);}
.perf-bar-wrap{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;}
.perf-bar{height:100%;border-radius:3px;transition:width .6s ease;}
.perf-val{width:60px;text-align:right;font-weight:600;font-family:'JetBrains Mono',monospace;}

/* ATH */
.ath-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:16px;}
.ath-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F8FAFC;font-size:13px;}
.ath-row:last-child{border-bottom:none;}
.ath-label{color:var(--text2);}
.ath-val{font-weight:600;font-family:'JetBrains Mono',monospace;font-size:12px;}

/* NOT FOUND */
.not-found{text-align:center;padding:80px 24px;}
.not-found h2{font-size:20px;font-weight:700;margin-bottom:8px;}
.not-found p{color:var(--text2);margin-bottom:20px;}
.not-found a{color:var(--blue);text-decoration:none;font-weight:600;}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-left">
    <a href="/" class="nav-logo">
      <div class="nav-logo-icon">P</div>
      <div class="nav-logo-name">Pulse<span>Stock</span></div>
    </a>
    <a href="/" class="nav-back">← Back</a>
  </div>
  <div class="nav-search">
    <input class="nav-input" id="search-input" type="text" placeholder="Search crypto..." onkeydown="if(event.key==='Enter') goSearch()" />
    <button class="nav-btn" onclick="goSearch()">Go</button>
  </div>
</nav>

<div id="main-content">
  <div class="loading-state" id="loading">Loading crypto data...</div>
</div>

<script>
// ── COINGECKO SYMBOL MAP ──────────────────────────────────────────────────────
const COIN_IDS = {
  'BTC':'bitcoin','ETH':'ethereum','SOL':'solana','XRP':'ripple',
  'DOGE':'dogecoin','ADA':'cardano','AVAX':'avalanche-2','DOT':'polkadot',
  'LINK':'chainlink','MATIC':'matic-network','UNI':'uniswap','LTC':'litecoin',
  'NEAR':'near','APT':'aptos','ARB':'arbitrum','OP':'optimism',
  'ATOM':'cosmos','ALGO':'algorand','SAND':'the-sandbox','MANA':'decentraland',
  'FTM':'fantom','HBAR':'hedera-hashgraph','ICP':'internet-computer',
  'FIL':'filecoin','VET':'vechain','EGLD':'elrond-erd-2','THETA':'theta-token',
  'EOS':'eos','AAVE':'aave','MKR':'maker','COMP':'compound-governance-token',
  'SNX':'synthetix-network-token','CRV':'curve-dao-token','SUSHI':'sushi',
  'YFI':'yearn-finance','BAT':'basic-attention-token','ZEC':'zcash',
  'DASH':'dash','XMR':'monero','BCH':'bitcoin-cash','BSV':'bitcoin-cash-sv',
  'SHIB':'shiba-inu','PEPE':'pepe','WIF':'dogwifcoin','BONK':'bonk',
  'TRX':'tron','TON':'the-open-network','SUI':'sui','SEI':'sei-network',
};

function getCoinId(sym) {
  return COIN_IDS[sym.toUpperCase()] || sym.toLowerCase();
}

function fmt(n, dec=2) {
  if (!n && n !== 0) return '—';
  n = parseFloat(n);
  if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return '$' + (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6)  return '$' + (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3)  return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  if (n >= 1)    return '$' + n.toFixed(dec);
  return '$' + n.toFixed(6);
}

function fmtPct(n) {
  if (!n && n !== 0) return '—';
  var sign = n >= 0 ? '+' : '';
  return sign + parseFloat(n).toFixed(2) + '%';
}

function fmtNum(n) {
  if (!n && n !== 0) return '—';
  n = parseFloat(n);
  if (n >= 1e12) return (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6)  return (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3)  return (n/1e3).toFixed(2) + 'K';
  return n.toLocaleString();
}

function pctClass(n) { return n >= 0 ? 'up' : 'dn'; }

// ── LOAD COIN ─────────────────────────────────────────────────────────────────
async function loadCoin(coinId) {
  // Try direct CoinGecko first (works from browser), fall back to proxy
  var urls = [
    'https://api.coingecko.com/api/v3/coins/' + coinId + '?localization=false&tickers=false&community_data=false&developer_data=false&sparkline=false',
    '/api/crypto?id=' + encodeURIComponent(coinId)
  ];
  for (var i = 0; i < urls.length; i++) {
    try {
      var ctrl = new AbortController();
      var tid = setTimeout(function(){ ctrl.abort(); }, 8000);
      var resp = await fetch(urls[i], { signal: ctrl.signal });
      clearTimeout(tid);
      if (!resp.ok) continue;
      var c = await resp.json();
      if (c.error) continue;
      // Normalize CoinGecko full response vs flat proxy response
      if (c.market_data) {
        // Full CoinGecko response — convert to flat
        var m = c.market_data;
        c = {
          id: coinId, sym: (c.symbol||'').toUpperCase(), name: c.name,
          tvSym: TV_SYMS[coinId] || ('BINANCE:' + coinId.toUpperCase().replace(/-/g,'') + 'USDT'),
          image: c.image, rank: c.market_cap_rank,
          price: m.current_price && m.current_price.usd || 0,
          chg24: m.price_change_percentage_24h || 0,
          chg7:  m.price_change_percentage_7d  || 0,
          chg30: m.price_change_percentage_30d || 0,
          chg1y: m.price_change_percentage_1y  || 0,
          marketCap: m.market_cap && m.market_cap.usd,
          volume24:  m.total_volume && m.total_volume.usd,
          fdv: m.fully_diluted_valuation && m.fully_diluted_valuation.usd,
          circSupply: m.circulating_supply, totalSupply: m.total_supply, maxSupply: m.max_supply,
          ath: m.ath && m.ath.usd, athChg: m.ath_change_percentage && m.ath_change_percentage.usd,
          athDate: m.ath_date && m.ath_date.usd,
          atl: m.atl && m.atl.usd, atlChg: m.atl_change_percentage && m.atl_change_percentage.usd,
          atlDate: m.atl_date && m.atl_date.usd,
          sentiment_up: c.sentiment_votes_up_percentage,
          sentiment_dn: c.sentiment_votes_down_percentage,
          coingecko_score: c.coingecko_score,
          description: c.description && c.description.en,
          links: c.links,
        };
      }
      renderCoin(c);
      return;
    } catch(e) { continue; }
  }
  var el = document.getElementById('main-content');
  if (el) el.innerHTML = '<div style="text-align:center;padding:60px 24px;color:#94A3B8;">Failed to load data. <a href="javascript:location.reload()" style="color:#1A6BF5;">Try again</a></div>';
}

function renderCoin(c) {
  const price  = c.price  || 0;
  const chg24  = c.chg24  || 0;
  const chg7   = c.chg7   || 0;
  const chg30  = c.chg30  || 0;
  const chg1y  = c.chg1y  || 0;
  const sym    = c.sym    || currentCoinId.toUpperCase();
  const chgClass = chg24 >= 0 ? 'up' : 'dn';

  const logoHtml = c.image && c.image.large
    ? `<img class="coin-icon" src="${c.image.large}" alt="${c.name}" />`
    : `<div class="coin-icon-placeholder">${sym.slice(0,2)}</div>`;

  const priceStr = price >= 10000
    ? '$' + Math.round(price).toLocaleString()
    : '$' + price.toFixed(2);

  const chgStr = (chg24 >= 0 ? '+' : '') + chg24.toFixed(2) + '%';

  function fmt(n) {
    if (!n && n !== 0) return '—';
    n = parseFloat(n);
    if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
    if (n >= 1e9)  return '$' + (n/1e9).toFixed(2) + 'B';
    if (n >= 1e6)  return '$' + (n/1e6).toFixed(2) + 'M';
    if (n >= 1e3)  return '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    if (n >= 1)    return '$' + n.toFixed(2);
    return '$' + n.toFixed(6);
  }
  function fmtNum(n) {
    if (!n) return '—';
    n = parseFloat(n);
    if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
    return n.toLocaleString();
  }
  function fmtPct(n) {
    if (!n && n !== 0) return '—';
    return (n >= 0 ? '+' : '') + parseFloat(n).toFixed(2) + '%';
  }
  function perfBar(label, val) {
    const abs = Math.abs(val || 0);
    const w = Math.min(abs * 2, 100);
    const col = val >= 0 ? '#16A34A' : '#DC2626';
    const cls = val >= 0 ? 'up' : 'dn';
    return `<div class="perf-row"><span class="perf-label">${label}</span><div class="perf-bar-wrap"><div class="perf-bar" style="width:${w}%;background:${col}"></div></div><span class="perf-val ${cls}">${fmtPct(val)}</span></div>`;
  }
  function statRow(l, v) {
    return `<div class="stat-row"><span class="stat-label">${l}</span><span class="stat-val">${v}</span></div>`;
  }

  const volMktCap = c.volume24 && c.marketCap
    ? (c.volume24 / c.marketCap * 100).toFixed(2) + '%' : '—';

  const pctCirc = c.circSupply && c.maxSupply
    ? (c.circSupply / c.maxSupply * 100).toFixed(1) + '%'
    : c.maxSupply === null ? 'No max supply' : '—';

  const desc = c.description
    ? c.description.replace(/<[^>]+>/g,'').split('. ').slice(0,3).join('. ') + '.'
    : '';



  const html = `
<div class="loading-state" style="padding:0;">
  <div style="max-width:1100px;margin:0 auto;padding:24px 24px 0;">

    <!-- COIN HEADER -->
    <div class="coin-header">
      ${logoHtml}
      <div class="coin-info">
        <div class="coin-name-row">
          <span class="coin-name">${c.name}</span>
          <span class="coin-sym">${sym}</span>
          ${c.rank ? `<span class="coin-rank">#${c.rank}</span>` : ''}
        </div>
        <div class="coin-price-row">
          <span class="coin-price">${priceStr}</span>
          <span class="coin-chg ${chgClass}">${chgStr} (24h)</span>
        </div>
        <div class="coin-updated">Updated just now · Data via CoinGecko</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 320px;gap:20px;padding-bottom:40px;">
      <div>
        <!-- CHART -->
        <div class="chart-card">
          <div class="chart-header">
            <span class="chart-title">Price Chart</span>
            <span style="font-size:11px;color:var(--text3);">Interactive chart with RSI · MACD</span>
          </div>
          <div id="tv-chart-container" style="height:640px;width:100%;border-radius:0 0 12px 12px;overflow:hidden;"></div>
        </div>

        <!-- PERFORMANCE -->
        <div class="perf-card">
          <div class="perf-title">Price Performance</div>
          ${perfBar('24h', chg24)}
          ${perfBar('7D', chg7)}
          ${perfBar('30D', chg30)}
          ${perfBar('1Y', chg1y)}
        </div>


      </div>

      <div>
        <div class="stats-card">
          <div class="stats-title">Market Stats</div>
          ${statRow('Market Cap', fmt(c.marketCap))}
          ${statRow('Fully Diluted', fmt(c.fdv))}
          ${statRow('24h Volume', fmt(c.volume24))}
          ${statRow('Vol/Mkt Cap', volMktCap)}
          ${statRow('Circulating', c.circSupply ? fmtNum(c.circSupply) + ' ' + sym : '—')}
          ${statRow('Total Supply', c.totalSupply ? fmtNum(c.totalSupply) + ' ' + sym : '∞')}
          ${statRow('Max Supply', c.maxSupply ? fmtNum(c.maxSupply) + ' ' + sym : '∞')}
        </div>
        <div class="ath-card">
          <div class="stats-title">All-Time Records</div>
          ${statRow('All-Time High', fmt(c.ath) + (c.athChg ? ' <span class="' + (c.athChg >= 0 ? 'up' : 'dn') + '">(' + fmtPct(c.athChg) + ')</span>' : ''))}
          ${statRow('ATH Date', c.athDate ? new Date(c.athDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—')}
          ${statRow('All-Time Low', fmt(c.atl) + (c.atlChg ? ' <span class="' + (c.atlChg >= 0 ? 'up' : 'dn') + '">(' + fmtPct(c.atlChg) + ')</span>' : ''))}
          ${statRow('ATL Date', c.atlDate ? new Date(c.atlDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—')}
        </div>
        <div class="stats-card" style="margin-top:12px;">
          <div class="stats-title">Supply & Inflation</div>
          ${statRow('% Circulating', pctCirc)}
          ${statRow('Sentiment ▲', c.sentiment_up ? '<span class="up">' + c.sentiment_up.toFixed(0) + '%</span>' : '—')}
          ${statRow('Sentiment ▼', c.sentiment_dn ? '<span class="dn">' + c.sentiment_dn.toFixed(0) + '%</span>' : '—')}
          ${statRow('CoinGecko Score', c.coingecko_score ? c.coingecko_score.toFixed(0) + '/100' : '—')}
        </div>
      </div>
    </div>
  </div>
</div>`;

  document.getElementById('main-content').innerHTML = html;
  document.title = sym + ' ' + priceStr + ' — PulseStock';
  setTimeout(function() { loadTVChart(coinId); }, 400);
}!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crypto — PulseStock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

:root{
  --bg:#F8FAFC;--surface:#fff;--border:#E2E8F0;--text:#0F172A;
  --text2:#475569;--text3:#94A3B8;--blue:#1A6BF5;--green:#16A34A;
  --red:#DC2626;--green-bg:#F0FDF4;--red-bg:#FEF2F2;
}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}

/* NAV */
.nav{background:#fff;border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100;}
.nav-left{display:flex;align-items:center;gap:20px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.nav-logo-icon{width:28px;height:28px;background:var(--blue);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;}
.nav-logo-name{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.4px;}
.nav-logo-name span{color:var(--blue);}
.nav-back{font-size:13px;color:var(--text2);text-decoration:none;padding:6px 12px;border-radius:7px;border:1px solid var(--border);transition:all .15s;}
.nav-back:hover{border-color:var(--blue);color:var(--blue);}
.nav-search{display:flex;gap:6px;}
.nav-input{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-size:13px;font-family:'Inter',sans-serif;color:var(--text);outline:none;width:160px;}
.nav-input:focus{border-color:var(--blue);}
.nav-btn{background:var(--blue);color:#fff;border:none;border-radius:7px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
.nav-btn:hover{background:#1558D6;}

/* HERO */
.hero{max-width:1100px;margin:0 auto;padding:32px 24px 0;}
.loading-state{text-align:center;padding:80px 24px;color:var(--text3);font-size:15px;}
.coin-header{display:flex;align-items:flex-start;gap:20px;margin-bottom:24px;}
.coin-icon{width:56px;height:56px;border-radius:14px;object-fit:contain;flex-shrink:0;background:var(--bg);border:1px solid var(--border);}
.coin-icon-placeholder{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#F59E0B,#EA580C);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;flex-shrink:0;}
.coin-info{flex:1;}
.coin-name-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
.coin-name{font-size:28px;font-weight:800;letter-spacing:-.5px;}
.coin-sym{font-size:14px;font-weight:600;color:var(--text3);background:var(--bg);border:1px solid var(--border);padding:3px 8px;border-radius:6px;}
.coin-rank{font-size:12px;font-weight:600;color:var(--text3);background:var(--bg);border:1px solid var(--border);padding:3px 8px;border-radius:6px;}
.coin-price-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.coin-price{font-size:36px;font-weight:800;letter-spacing:-1px;font-family:'JetBrains Mono',monospace;}
.coin-chg{font-size:16px;font-weight:600;padding:4px 10px;border-radius:8px;}
.coin-chg.up{color:var(--green);background:var(--green-bg);}
.coin-chg.dn{color:var(--red);background:var(--red-bg);}
.coin-updated{font-size:11px;color:var(--text3);margin-top:4px;}

/* GRID */
.main-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;max-width:1100px;margin:0 auto;padding:0 24px 40px;}

/* CHART */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.chart-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.chart-title{font-size:14px;font-weight:600;}
.chart-periods{display:flex;gap:4px;}
.period-btn{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text3);font-family:'Inter',sans-serif;transition:all .15s;}
.period-btn.active{background:var(--blue);color:#fff;}
.period-btn:hover:not(.active){background:var(--bg);color:var(--text);}

/* STATS CARDS */
.stats-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;}
.stats-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F8FAFC;font-size:13px;}
.stat-row:last-child{border-bottom:none;}
.stat-label{color:var(--text2);}
.stat-val{font-weight:600;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;}
.stat-val.up{color:var(--green);}
.stat-val.dn{color:var(--red);}

/* ABOUT */
.about-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:16px;}
.about-title{font-size:13px;font-weight:700;margin-bottom:10px;}
.about-text{font-size:13px;color:var(--text2);line-height:1.7;}
.about-links{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.about-link{font-size:12px;font-weight:600;color:var(--blue);text-decoration:none;padding:4px 10px;border:1px solid #BFDBFE;border-radius:6px;background:#EFF6FF;transition:all .15s;}
.about-link:hover{background:#DBEAFE;}

/* PERF BARS */
.perf-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:16px;}
.perf-title{font-size:13px;font-weight:700;margin-bottom:14px;}
.perf-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;}
.perf-label{width:36px;color:var(--text3);}
.perf-bar-wrap{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;}
.perf-bar{height:100%;border-radius:3px;transition:width .6s ease;}
.perf-val{width:60px;text-align:right;font-weight:600;font-family:'JetBrains Mono',monospace;}

/* ATH */
.ath-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:16px;}
.ath-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F8FAFC;font-size:13px;}
.ath-row:last-child{border-bottom:none;}
.ath-label{color:var(--text2);}
.ath-val{font-weight:600;font-family:'JetBrains Mono',monospace;font-size:12px;}

/* NOT FOUND */
.not-found{text-align:center;padding:80px 24px;}
.not-found h2{font-size:20px;font-weight:700;margin-bottom:8px;}
.not-found p{color:var(--text2);margin-bottom:20px;}
.not-found a{color:var(--blue);text-decoration:none;font-weight:600;}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-left">
    <a href="/" class="nav-logo">
      <div class="nav-logo-icon">P</div>
      <div class="nav-logo-name">Pulse<span>Stock</span></div>
    </a>
    <a href="/" class="nav-back">← Back</a>
  </div>
  <div class="nav-search">
    <input class="nav-input" id="search-input" type="text" placeholder="Search crypto..." onkeydown="if(event.key==='Enter') goSearch()" />
    <button class="nav-btn" onclick="goSearch()">Go</button>
  </div>
</nav>

<div id="main-content">
  <div class="loading-state" id="loading">Loading crypto data...</div>
</div>

<script>
// ── COINGECKO SYMBOL MAP ──────────────────────────────────────────────────────
const COIN_IDS = {
  'BTC':'bitcoin','ETH':'ethereum','SOL':'solana','XRP':'ripple',
  'DOGE':'dogecoin','ADA':'cardano','AVAX':'avalanche-2','DOT':'polkadot',
  'LINK':'chainlink','MATIC':'matic-network','UNI':'uniswap','LTC':'litecoin',
  'NEAR':'near','APT':'aptos','ARB':'arbitrum','OP':'optimism',
  'ATOM':'cosmos','ALGO':'algorand','SAND':'the-sandbox','MANA':'decentraland',
  'FTM':'fantom','HBAR':'hedera-hashgraph','ICP':'internet-computer',
  'FIL':'filecoin','VET':'vechain','EGLD':'elrond-erd-2','THETA':'theta-token',
  'EOS':'eos','AAVE':'aave','MKR':'maker','COMP':'compound-governance-token',
  'SNX':'synthetix-network-token','CRV':'curve-dao-token','SUSHI':'sushi',
  'YFI':'yearn-finance','BAT':'basic-attention-token','ZEC':'zcash',
  'DASH':'dash','XMR':'monero','BCH':'bitcoin-cash','BSV':'bitcoin-cash-sv',
  'SHIB':'shiba-inu','PEPE':'pepe','WIF':'dogwifcoin','BONK':'bonk',
  'TRX':'tron','TON':'the-open-network','SUI':'sui','SEI':'sei-network',
};

function getCoinId(sym) {
  return COIN_IDS[sym.toUpperCase()] || sym.toLowerCase();
}

function fmt(n, dec=2) {
  if (!n && n !== 0) return '—';
  n = parseFloat(n);
  if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return '$' + (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6)  return '$' + (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3)  return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  if (n >= 1)    return '$' + n.toFixed(dec);
  return '$' + n.toFixed(6);
}

function fmtPct(n) {
  if (!n && n !== 0) return '—';
  var sign = n >= 0 ? '+' : '';
  return sign + parseFloat(n).toFixed(2) + '%';
}

function fmtNum(n) {
  if (!n && n !== 0) return '—';
  n = parseFloat(n);
  if (n >= 1e12) return (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6)  return (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3)  return (n/1e3).toFixed(2) + 'K';
  return n.toLocaleString();
}

function pctClass(n) { return n >= 0 ? 'up' : 'dn'; }

// ── LOAD COIN ─────────────────────────────────────────────────────────────────
async function loadCoin(coinId) {
  // Try direct CoinGecko first (works from browser), fall back to proxy
  var urls = [
    'https://api.coingecko.com/api/v3/coins/' + coinId + '?localization=false&tickers=false&community_data=false&developer_data=false&sparkline=false',
    '/api/crypto?id=' + encodeURIComponent(coinId)
  ];
  for (var i = 0; i < urls.length; i++) {
    try {
      var ctrl = new AbortController();
      var tid = setTimeout(function(){ ctrl.abort(); }, 8000);
      var resp = await fetch(urls[i], { signal: ctrl.signal });
      clearTimeout(tid);
      if (!resp.ok) continue;
      var c = await resp.json();
      if (c.error) continue;
      // Normalize CoinGecko full response vs flat proxy response
      if (c.market_data) {
        // Full CoinGecko response — convert to flat
        var m = c.market_data;
        c = {
          id: coinId, sym: (c.symbol||'').toUpperCase(), name: c.name,
          tvSym: TV_SYMS[coinId] || ('BINANCE:' + coinId.toUpperCase().replace(/-/g,'') + 'USDT'),
          image: c.image, rank: c.market_cap_rank,
          price: m.current_price && m.current_price.usd || 0,
          chg24: m.price_change_percentage_24h || 0,
          chg7:  m.price_change_percentage_7d  || 0,
          chg30: m.price_change_percentage_30d || 0,
          chg1y: m.price_change_percentage_1y  || 0,
          marketCap: m.market_cap && m.market_cap.usd,
          volume24:  m.total_volume && m.total_volume.usd,
          fdv: m.fully_diluted_valuation && m.fully_diluted_valuation.usd,
          circSupply: m.circulating_supply, totalSupply: m.total_supply, maxSupply: m.max_supply,
          ath: m.ath && m.ath.usd, athChg: m.ath_change_percentage && m.ath_change_percentage.usd,
          athDate: m.ath_date && m.ath_date.usd,
          atl: m.atl && m.atl.usd, atlChg: m.atl_change_percentage && m.atl_change_percentage.usd,
          atlDate: m.atl_date && m.atl_date.usd,
          sentiment_up: c.sentiment_votes_up_percentage,
          sentiment_dn: c.sentiment_votes_down_percentage,
          coingecko_score: c.coingecko_score,
          description: c.description && c.description.en,
          links: c.links,
        };
      }
      renderCoin(c);
      return;
    } catch(e) { continue; }
  }
  var el = document.getElementById('main-content');
  if (el) el.innerHTML = '<div style="text-align:center;padding:60px 24px;color:#94A3B8;">Failed to load data. <a href="javascript:location.reload()" style="color:#1A6BF5;">Try again</a></div>';
}

function renderCoin(c, chart) {
  const m = c.market_data || {};
  const price = m.current_price?.usd || 0;
  const chg24 = m.price_change_percentage_24h || 0;
  const chg7  = m.price_change_percentage_7d  || 0;
  const chg30 = m.price_change_percentage_30d || 0;
  const chg1y = m.price_change_percentage_1y  || 0;
  const chgClass = chg24 >= 0 ? 'up' : 'dn';
  const sym = (c.symbol || '').toUpperCase();

  // Build sparkline from chart data
  const prices = (chart.prices || []).map(p => p[1]);
  const minP = Math.min(...prices);
  const maxP = Math.max(...prices);
  const sparkPoints = prices.map((p, i) => {
    const x = (i / (prices.length - 1)) * 600;
    const y = 80 - ((p - minP) / (maxP - minP || 1)) * 70;
    return x + ',' + y;
  }).join(' ');
  const sparkColor = chg7 >= 0 ? '#16A34A' : '#DC2626';
  const sparkFill  = chg7 >= 0 ? 'rgba(22,163,74,0.08)' : 'rgba(220,38,38,0.08)';

  const html = `
<div class="hero">
  <div class="coin-header">
    ${c.image?.large
      ? `<img class="coin-icon" src="${c.image.large}" alt="${c.name}" />`
      : `<div class="coin-icon-placeholder">${sym.slice(0,2)}</div>`}
    <div class="coin-info">
      <div class="coin-name-row">
        <span class="coin-name">${c.name}</span>
        <span class="coin-sym">${sym}</span>
        ${c.market_cap_rank ? `<span class="coin-rank">#${c.market_cap_rank}</span>` : ''}
      </div>
      <div class="coin-price-row">
        <span class="coin-price">${fmt(price)}</span>
        <span class="coin-chg ${chgClass}">${fmtPct(chg24)} (24h)</span>
      </div>
      <div class="coin-updated">Updated just now · Data via CoinGecko</div>
    </div>
  </div>
</div>

<div class="main-grid">
  <div>
    <!-- CHART -->
    <div class="chart-card">
      <div class="chart-header">
        <span class="chart-title">Price Chart (7 days)</span>
        <div class="chart-periods" style="font-size:11px;color:var(--text3);">Interactive chart with RSI · MACD</div>
      </div>
      <div id="tv-chart-container" style="height:640px;width:100%;border-radius:0 0 12px 12px;overflow:hidden;"></div>
    </div>

    <!-- PERFORMANCE -->
    <div class="perf-card">
      <div class="perf-title">Price Performance</div>
      ${[
        ['24h', chg24],
        ['7D',  chg7],
        ['30D', chg30],
        ['1Y',  chg1y],
      ].map(([label, val]) => {
        const abs = Math.abs(val || 0);
        const barW = Math.min(abs * 2, 100);
        const col = val >= 0 ? '#16A34A' : '#DC2626';
        return `<div class="perf-row">
          <span class="perf-label">${label}</span>
          <div class="perf-bar-wrap"><div class="perf-bar" style="width:${barW}%;background:${col};"></div></div>
          <span class="perf-val ${pctClass(val)}">${fmtPct(val)}</span>
        </div>`;
      }).join('')}
    </div>

    <!-- ABOUT -->
    ${c.description?.en ? `
    <div class="about-card">
      <div class="about-title">About ${c.name}</div>
      <div class="about-text">${c.description.en.split('. ').slice(0,3).join('. ') + '.'}</div>
      <div class="about-links">
        ${c.links?.homepage?.[0] ? `<a class="about-link" href="${c.links.homepage[0]}" target="_blank">🌐 Website</a>` : ''}
        ${c.links?.blockchain_site?.[0] ? `<a class="about-link" href="${c.links.blockchain_site[0]}" target="_blank">🔗 Explorer</a>` : ''}
        ${c.links?.repos_url?.github?.[0] ? `<a class="about-link" href="${c.links.repos_url.github[0]}" target="_blank">📦 GitHub</a>` : ''}
      </div>
    </div>` : ''}
  </div>

  <div>
    <!-- MARKET STATS -->
    <div class="stats-card">
      <div class="stats-title">Market Stats</div>
      ${[
        ['Market Cap',      fmt(m.market_cap?.usd)],
        ['Fully Diluted',   fmt(m.fully_diluted_valuation?.usd)],
        ['24h Volume',      fmt(m.total_volume?.usd)],
        ['Vol/Mkt Cap',     m.total_volume?.usd && m.market_cap?.usd ? (m.total_volume.usd/m.market_cap.usd*100).toFixed(2)+'%' : '—'],
        ['Circulating',     fmtNum(m.circulating_supply) + ' ' + sym],
        ['Total Supply',    m.total_supply ? fmtNum(m.total_supply) + ' ' + sym : '∞'],
        ['Max Supply',      m.max_supply ? fmtNum(m.max_supply) + ' ' + sym : '∞'],
      ].map(([l,v]) => `<div class="stat-row"><span class="stat-label">${l}</span><span class="stat-val">${v}</span></div>`).join('')}
    </div>

    <!-- ATH / ATL -->
    <div class="ath-card">
      <div class="stats-title">All-Time Records</div>
      ${[
        ['All-Time High', fmt(m.ath?.usd), fmtPct(m.ath_change_percentage?.usd), m.ath_change_percentage?.usd < 0 ? 'dn' : 'up'],
        ['ATH Date', m.ath_date?.usd ? new Date(m.ath_date.usd).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—', null, null],
        ['All-Time Low', fmt(m.atl?.usd), fmtPct(m.atl_change_percentage?.usd), m.atl_change_percentage?.usd >= 0 ? 'up' : 'dn'],
        ['ATL Date', m.atl_date?.usd ? new Date(m.atl_date.usd).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—', null, null],
      ].map(([l,v,pct,cls]) => `<div class="ath-row">
        <span class="ath-label">${l}</span>
        <span class="ath-val">${v}${pct ? ' <span style="font-size:11px;color:var(--'+(cls==='up'?'green':'red')+')">('+pct+')</span>' : ''}</span>
      </div>`).join('')}
    </div>

    <!-- SUPPLY INFO -->
    <div class="stats-card" style="margin-top:16px;">
      <div class="stats-title">Supply & Inflation</div>
      ${[
        ['% Circulating', m.circulating_supply && m.max_supply ? (m.circulating_supply/m.max_supply*100).toFixed(1)+'%' : m.max_supply === null ? 'No max supply' : '—'],
        ['Sentiment Up',  c.sentiment_votes_up_percentage ? c.sentiment_votes_up_percentage.toFixed(0)+'%' : '—'],
        ['Sentiment Dn',  c.sentiment_votes_down_percentage ? c.sentiment_votes_down_percentage.toFixed(0)+'%' : '—'],
        ['CoinGecko Score', c.coingecko_score ? c.coingecko_score.toFixed(0)+'/100' : '—'],
      ].map(([l,v]) => `<div class="stat-row"><span class="stat-label">${l}</span><span class="stat-val">${v}</span></div>`).join('')}
    </div>
  </div>
</div>`;

  document.getElementById('main-content').innerHTML = html;
  document.title = sym + ' $' + price.toLocaleString() + ' — PulseStock';
  setTimeout(function() { loadTVChart(coinId); }, 400);
}

function showNotFound(coinId) {
  document.getElementById('main-content').innerHTML = `
    <div class="not-found">
      <h2>⚠ Crypto not found</h2>
      <p>We couldn't find data for "<strong>${coinId}</strong>". Check the symbol and try again.</p>
      <a href="/">← Back to PulseStock</a>
    </div>`;
}

function goSearch() {
  var val = document.getElementById('search-input').value.trim().toUpperCase();
  if (!val) return;
  var id = getCoinId(val);
  window.location.href = '/crypto/' + id;
}

// ── TRADINGVIEW ───────────────────────────────────────────────────────────────
var TV_SYMS = {"bitcoin": "BINANCE:BTCUSDT", "ethereum": "BINANCE:ETHUSDT", "solana": "BINANCE:SOLUSDT", "ripple": "BINANCE:XRPUSDT", "dogecoin": "BINANCE:DOGEUSDT", "cardano": "BINANCE:ADAUSDT", "avalanche-2": "BINANCE:AVAXUSDT", "polkadot": "BINANCE:DOTUSDT", "chainlink": "BINANCE:LINKUSDT", "matic-network": "BINANCE:MATICUSDT", "uniswap": "BINANCE:UNIUSDT", "litecoin": "BINANCE:LTCUSDT", "near": "BINANCE:NEARUSDT", "aptos": "BINANCE:APTUSDT", "arbitrum": "BINANCE:ARBUSDT", "cosmos": "BINANCE:ATOMUSDT", "shiba-inu": "BINANCE:SHIBUSDT", "tron": "BINANCE:TRXUSDT", "the-open-network": "BINANCE:TONUSDT", "sui": "BINANCE:SUIUSDT", "pepe": "BINANCE:PEPEUSDT"};

function loadTVChart(coinId) {
  var sym = TV_SYMS[coinId] || ('BINANCE:' + coinId.toUpperCase().replace(/-/g,'') + 'USDT');
  var el = document.getElementById('tv-chart-container');
  if (!el) return;
  el.innerHTML = '<iframe src="https://s.tradingview.com/widgetembed/?symbol=' + encodeURIComponent(sym) + '&interval=D&theme=light&style=1&locale=en&toolbar_bg=F4F7FD&withdateranges=1&hide_top_toolbar=0&studies=RSI%40tv-basicstudies%1FMACD%40tv-basicstudies&showpopupbutton=1" style="width:100%;height:640px;border:none;" allowtransparency="true" allowfullscreen></iframe>';
}

// ── INIT ─────────────────────────────────────────────────────────────────────
var coinId = window.location.pathname.replace('/crypto/', '').toLowerCase().trim();
if (!coinId || coinId === 'crypto') {
  showNotFound('unknown');
} else {
  loadCoin(coinId);
}
</script>
</body>
</html>
