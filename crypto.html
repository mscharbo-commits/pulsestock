<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crypto — PulseStock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F7F8FA;--surface:#fff;--surface2:#F2F4F7;--surface3:#E9ECF2;
  --border:#E2E6ED;--border2:#D0D6E0;--text:#0D1117;--text2:#2D3748;
  --text3:#4A5568;--accent:#1A6BF5;--accent-light:#EBF1FE;--accent2:#0F4FC4;
  --green:#0D9B6B;--green-bg:#E6F7F1;--red:#D13F30;--red-bg:#FDECEA;
  --amber:#B45309;--amber-bg:#FEF3C7;--radius:12px;--radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.04);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-icon{width:32px;height:32px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;}
.logo-name{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.4px;}
.logo-name span{color:var(--accent);}
.header-right{display:flex;align-items:center;gap:10px;}
.search-wrap{position:relative;display:flex;gap:6px;}
.search-wrap input{width:180px;padding:7px 12px;font-size:13px;border-radius:var(--radius-sm);border:1.5px solid var(--border);}
.search-wrap input:focus{border-color:var(--accent);}
.btn-primary{background:var(--accent);color:#fff;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-primary:hover{background:var(--accent2);}
.back-btn{font-size:13px;color:var(--text2);text-decoration:none;padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);transition:all .15s;}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:28px 24px;}

/* COIN HEADER */
.coin-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;}
.coin-logo{width:52px;height:52px;border-radius:12px;object-fit:contain;border:1px solid var(--border);background:var(--surface);}
.coin-logo-fallback{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#F59E0B,#EA580C);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0;}
.coin-meta{flex:1;}
.coin-name-row{display:flex;align-items:center;gap:8px;margin-bottom:2px;flex-wrap:wrap;}
.coin-name{font-size:24px;font-weight:700;letter-spacing:-.5px;}
.coin-sym{font-size:13px;font-weight:600;font-family:'DM Mono',monospace;color:var(--text3);background:var(--surface2);border:1px solid var(--border);padding:2px 8px;border-radius:5px;}
.coin-rank{font-size:12px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);padding:2px 8px;border-radius:5px;}
.coin-price-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.coin-price{font-size:32px;font-weight:700;font-family:'DM Mono',monospace;letter-spacing:-1px;}
.coin-chg{font-size:14px;font-weight:600;padding:3px 9px;border-radius:6px;}
.coin-chg.up{color:var(--green);background:var(--green-bg);}
.coin-chg.dn{color:var(--red);background:var(--red-bg);}
.coin-updated{font-size:11px;color:var(--text3);margin-top:4px;}

/* QUICK NAV */
.quick-nav{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;padding-bottom:2px;}
.qn-btn{font-size:12px;font-weight:500;padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;white-space:nowrap;text-decoration:none;font-family:'DM Sans',sans-serif;transition:all .15s;}
.qn-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}

/* GRID */
.content-grid{display:grid;grid-template-columns:1fr 320px;gap:20px;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow);}
.card-title{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);}

/* TV CHART */
.tv-chart-wrap{height:450px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:16px;}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.met{background:var(--surface2);border-radius:var(--radius-sm);padding:12px 14px;border:1px solid var(--border);}
.ml{font-size:11px;color:var(--text3);margin-bottom:4px;font-weight:500;}
.mv{font-size:14px;font-weight:600;font-family:'DM Mono',monospace;}
.mv.up{color:var(--green);}.mv.dn{color:var(--red);}

/* SIDEBAR STATS */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--surface2);font-size:13px;}
.stat-row:last-child{border-bottom:none;}
.stat-label{color:var(--text3);}
.stat-val{font-weight:600;font-family:'DM Mono',monospace;font-size:12px;}

/* PERF */
.perf-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;}
.perf-label{width:32px;color:var(--text3);font-size:12px;}
.perf-bar-wrap{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.perf-bar{height:100%;border-radius:3px;}
.perf-val{width:62px;text-align:right;font-weight:600;font-family:'DM Mono',monospace;font-size:12px;}
.up{color:var(--green);}.dn{color:var(--red);}

/* ABOUT */
.about-text{font-size:13px;color:var(--text2);line-height:1.7;}
.about-links{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.about-link{font-size:12px;font-weight:500;color:var(--accent);text-decoration:none;padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);transition:all .15s;}
.about-link:hover{background:var(--accent-light);border-color:var(--accent);}

/* LOADING / ERROR */
.loading-state{text-align:center;padding:80px 24px;color:var(--text3);}
.not-found{text-align:center;padding:80px 24px;}
.not-found h2{font-size:20px;font-weight:700;margin-bottom:8px;}

/* NEWS */
.news-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--surface2);}
.news-item:last-child{border-bottom:none;}
.news-thumb{width:72px;height:52px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--surface2);}
.news-body{flex:1;min-width:0;}
.news-hl{font-size:13px;font-weight:600;color:var(--text);line-height:1.4;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.news-hl a{color:inherit;text-decoration:none;}
.news-hl a:hover{color:var(--accent);}
.news-meta{font-size:11px;color:var(--text3);}
.news-empty{font-size:13px;color:var(--text3);padding:16px 0;}
</style>
</head>
<body>

<header>
  <a href="/" class="logo">
    <div class="logo-icon">P</div>
    <div class="logo-name">Pulse<span>Stock</span></div>
  </a>
  <div class="header-right">
    <a href="/" class="back-btn">← Back</a>
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Search crypto..." onkeydown="if(event.key==='Enter') goSearch()" />
      <button class="btn-primary" onclick="goSearch()">Go</button>
    </div>
  </div>
</header>

<div id="main-content">
  <div class="loading-state">Loading crypto data...</div>
</div>

<script>
const COIN_IDS = {
  'BTC':'bitcoin','ETH':'ethereum','SOL':'solana','XRP':'ripple',
  'DOGE':'dogecoin','ADA':'cardano','AVAX':'avalanche-2','DOT':'polkadot',
  'LINK':'chainlink','MATIC':'matic-network','UNI':'uniswap','LTC':'litecoin',
  'NEAR':'near','APT':'aptos','ARB':'arbitrum','OP':'optimism','ATOM':'cosmos',
  'ALGO':'algorand','SAND':'the-sandbox','MANA':'decentraland','FIL':'filecoin',
  'VET':'vechain','AAVE':'aave','MKR':'maker','SHIB':'shiba-inu','PEPE':'pepe',
  'TRX':'tron','TON':'the-open-network','SUI':'sui','SEI':'sei-network',
  'BCH':'bitcoin-cash','XMR':'monero','DASH':'dash','ZEC':'zcash',
  'HBAR':'hedera-hashgraph','ICP':'internet-computer','FTM':'fantom',
};

// TradingView symbol map — crypto pairs
const TV_SYMBOLS = {
  'bitcoin':'BINANCE:BTCUSDT','ethereum':'BINANCE:ETHUSDT','solana':'BINANCE:SOLUSDT',
  'ripple':'BINANCE:XRPUSDT','dogecoin':'BINANCE:DOGEUSDT','cardano':'BINANCE:ADAUSDT',
  'avalanche-2':'BINANCE:AVAXUSDT','polkadot':'BINANCE:DOTUSDT','chainlink':'BINANCE:LINKUSDT',
  'matic-network':'BINANCE:MATICUSDT','uniswap':'BINANCE:UNIUSDT','litecoin':'BINANCE:LTCUSDT',
  'near':'BINANCE:NEARUSDT','aptos':'BINANCE:APTUSDT','arbitrum':'BINANCE:ARBUSDT',
  'optimism':'BINANCE:OPUSDT','cosmos':'BINANCE:ATOMUSDT','shiba-inu':'BINANCE:SHIBUSDT',
  'pepe':'BINANCE:PEPEUSDT','tron':'BINANCE:TRXUSDT','the-open-network':'BINANCE:TONUSDT',
  'sui':'BINANCE:SUIUSDT','bitcoin-cash':'BINANCE:BCHUSDT','hedera-hashgraph':'BINANCE:HBARUSDT',
  'internet-computer':'BINANCE:ICPUSDT','fantom':'BINANCE:FTMUSDT','aave':'BINANCE:AAVEUSDT',
  'maker':'BINANCE:MKRUSDT',
};

var currentCoinId = '';

function fmt(n, dec) {
  if (!n && n !== 0) return '—';
  dec = dec || 2;
  n = parseFloat(n);
  if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return '$' + (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6)  return '$' + (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3)  return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
  if (n >= 1)    return '$' + n.toFixed(dec);
  return '$' + n.toFixed(6);
}

function fmtNum(n) {
  if (!n && n !== 0) return '—';
  n = parseFloat(n);
  if (n >= 1e12) return (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6)  return (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3)  return (n/1e3).toFixed(1) + 'K';
  return n.toLocaleString();
}

function fmtPct(n) {
  if (!n && n !== 0) return '—';
  var v = parseFloat(n);
  return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
}

function pctClass(n) { return parseFloat(n) >= 0 ? 'up' : 'dn'; }

function loadTVChart(coinId) {
  var tvSym = TV_SYMBOLS[coinId] || ('BINANCE:' + coinId.toUpperCase().replace(/-/g,'') + 'USDT');
  var container = document.getElementById('tv-container');
  if (!container) return;
  try {
    new TradingView.widget({
      container_id: 'tv-container',
      symbol: tvSym,
      interval: 'D',
      timezone: 'exchange',
      theme: 'light',
      style: '1',
      locale: 'en',
      toolbar_bg: '#F4F7FD',
      enable_publishing: false,
      hide_top_toolbar: false,
      hide_legend: false,
      save_image: false,
      withdateranges: true,
      allow_symbol_change: false,
      studies: ['RSI@tv-basicstudies', 'MACD@tv-basicstudies'],
      width: '100%',
      height: 450,
      autosize: true,
      show_popup_button: true,
      popup_width: '1000',
      popup_height: '650',
    });
  } catch(e) {
    container.innerHTML = '<iframe src="https://s.tradingview.com/widgetembed/?symbol=' + tvSym + '&interval=D&theme=light&style=1&timezone=exchange&withdateranges=1&studies=RSI%40tv-basicstudies%1FMACD%40tv-basicstudies&showpopupbutton=1&locale=en" style="width:100%;height:450px;border:none;" allowtransparency="true" allowfullscreen></iframe>';
  }
}

async function loadCoin(coinId) {
  try {
    var resp = await fetch('/api/crypto?id=' + encodeURIComponent(coinId));
    if (!resp.ok) { showNotFound(coinId); return; }
    var c = await resp.json();
    if (c.error) { showNotFound(coinId); return; }
    renderCoin(c);
  } catch(e) {
    document.getElementById('main-content').innerHTML = '<div class="loading-state" style="color:var(--red);">Failed to load data. <a href="javascript:location.reload()" style="color:var(--accent);">Try again</a></div>';
  }
}

function renderCoin(c) {
  var m = c.market_data || {};
  var price = m.current_price && m.current_price.usd || 0;
  var chg24 = m.price_change_percentage_24h || 0;
  var chg7  = m.price_change_percentage_7d  || 0;
  var chg30 = m.price_change_percentage_30d || 0;
  var chg1y = m.price_change_percentage_1y  || 0;
  var sym = (c.symbol || '').toUpperCase();
  var chgClass = chg24 >= 0 ? 'up' : 'dn';

  document.title = sym + ' ' + fmt(price) + ' — PulseStock';

  var logoHtml = c.image && c.image.large
    ? '<img class="coin-logo" src="' + c.image.large + '" alt="' + c.name + '" />'
    : '<div class="coin-logo-fallback">' + sym.slice(0,2) + '</div>';

  var aboutHtml = '';
  if (c.description && c.description.en) {
    var desc = c.description.en.replace(/<[^>]+>/g, '').split('. ').slice(0,3).join('. ') + '.';
    var links = [];
    if (c.links && c.links.homepage && c.links.homepage[0]) links.push('<a class="about-link" href="' + c.links.homepage[0] + '" target="_blank">🌐 Website</a>');
    if (c.links && c.links.blockchain_site && c.links.blockchain_site[0]) links.push('<a class="about-link" href="' + c.links.blockchain_site[0] + '" target="_blank">🔗 Explorer</a>');
    if (c.links && c.links.repos_url && c.links.repos_url.github && c.links.repos_url.github[0]) links.push('<a class="about-link" href="' + c.links.repos_url.github[0] + '" target="_blank">📦 GitHub</a>');
    aboutHtml = '<div class="card"><div class="card-title">About ' + c.name + '</div><div class="about-text">' + desc + '</div>' + (links.length ? '<div class="about-links">' + links.join('') + '</div>' : '') + '</div>';
  }

  var html = '<div class="main">'
    // Header
    + '<div class="coin-header">'
    + logoHtml
    + '<div class="coin-meta">'
    + '<div class="coin-name-row"><span class="coin-name">' + c.name + '</span><span class="coin-sym">' + sym + '</span>' + (c.market_cap_rank ? '<span class="coin-rank">#' + c.market_cap_rank + '</span>' : '') + '</div>'
    + '<div class="coin-price-row"><span class="coin-price">' + fmt(price) + '</span><span class="coin-chg ' + chgClass + '">' + fmtPct(chg24) + ' 24h</span></div>'
    + '<div class="coin-updated">Real-time via CoinGecko · Updated just now</div>'
    + '</div></div>'

    // Quick nav
    + '<div class="quick-nav">'
    + '<a class="qn-btn" href="#chart">📈 Chart</a>'
    + '<a class="qn-btn" href="#stats">📊 Stats</a>'
    + '<a class="qn-btn" href="#performance">⚡ Performance</a>'
    + '<a class="qn-btn" href="#about">ℹ️ About</a>'
    + '<a class="qn-btn" href="#news">📰 News</a>'
    + '</div>'

    + '<div class="content-grid">'

    // LEFT COLUMN
    + '<div>'

    // Key metrics grid
    + '<div class="stat-grid" id="stats">'
    + metBox('Market Cap', fmt(m.market_cap && m.market_cap.usd))
    + metBox('24h Volume', fmt(m.total_volume && m.total_volume.usd))
    + metBox('24h Change', fmtPct(chg24), chgClass)
    + metBox('7D Change', fmtPct(chg7), chg7 >= 0 ? 'up' : 'dn')
    + metBox('All-Time High', fmt(m.ath && m.ath.usd))
    + metBox('From ATH', fmtPct(m.ath_change_percentage && m.ath_change_percentage.usd), m.ath_change_percentage && m.ath_change_percentage.usd >= 0 ? 'up' : 'dn')
    + '</div>'

    // TradingView chart
    + '<div class="tv-chart-wrap" id="chart"><div id="tv-container" style="height:100%;width:100%;"></div></div>'

    // Performance
    + '<div class="card" id="performance"><div class="card-title">Price Performance</div>'
    + perfRow('24h', chg24) + perfRow('7D', chg7) + perfRow('30D', chg30) + perfRow('1Y', chg1y)
    + '</div>'

    // About
    + aboutHtml
    + '<div class="card" id="news"><div class="card-title">Latest News</div><div id="news-list"><div class="news-empty">Loading news...</div></div></div>'
    + '</div>'

    // RIGHT COLUMN
    + '<div>'
    + '<div class="card"><div class="card-title">Market Statistics</div>'
    + statRow('Market Cap', fmt(m.market_cap && m.market_cap.usd))
    + statRow('Fully Diluted', fmt(m.fully_diluted_valuation && m.fully_diluted_valuation.usd))
    + statRow('24h Volume', fmt(m.total_volume && m.total_volume.usd))
    + statRow('Circulating', m.circulating_supply ? fmtNum(m.circulating_supply) + ' ' + sym : '—')
    + statRow('Total Supply', m.total_supply ? fmtNum(m.total_supply) + ' ' + sym : '∞')
    + statRow('Max Supply', m.max_supply ? fmtNum(m.max_supply) + ' ' + sym : '∞')
    + statRow('Vol/Mkt Cap', m.total_volume && m.total_volume.usd && m.market_cap && m.market_cap.usd ? (m.total_volume.usd/m.market_cap.usd*100).toFixed(2)+'%' : '—')
    + '</div>'

    + '<div class="card" style="margin-top:0;"><div class="card-title">All-Time Records</div>'
    + statRow('All-Time High', fmt(m.ath && m.ath.usd))
    + statRow('ATH Date', m.ath_date && m.ath_date.usd ? new Date(m.ath_date.usd).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—')
    + statRow('From ATH', '<span class="' + (m.ath_change_percentage && m.ath_change_percentage.usd >= 0 ? 'up' : 'dn') + '">' + fmtPct(m.ath_change_percentage && m.ath_change_percentage.usd) + '</span>')
    + statRow('All-Time Low', fmt(m.atl && m.atl.usd))
    + statRow('ATL Date', m.atl_date && m.atl_date.usd ? new Date(m.atl_date.usd).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—')
    + statRow('From ATL', '<span class="' + (m.atl_change_percentage && m.atl_change_percentage.usd >= 0 ? 'up' : 'dn') + '">' + fmtPct(m.atl_change_percentage && m.atl_change_percentage.usd) + '</span>')
    + '</div>'

    + '<div class="card" style="margin-top:0;"><div class="card-title">Supply Info</div>'
    + statRow('% Circulating', m.circulating_supply && m.max_supply ? (m.circulating_supply/m.max_supply*100).toFixed(1)+'%' : m.max_supply === null ? 'No max' : '—')
    + statRow('CoinGecko Score', c.coingecko_score ? c.coingecko_score.toFixed(0)+'/100' : '—')
    + statRow('Sentiment ▲', c.sentiment_votes_up_percentage ? '<span class="up">'+c.sentiment_votes_up_percentage.toFixed(0)+'%</span>' : '—')
    + statRow('Sentiment ▼', c.sentiment_votes_down_percentage ? '<span class="dn">'+c.sentiment_votes_down_percentage.toFixed(0)+'%</span>' : '—')
    + '</div>'

    + '</div>' // right col
    + '</div>' // grid
    + '</div>'; // main

  document.getElementById('main-content').innerHTML = html;

  // Load TradingView chart after DOM is ready
  setTimeout(function() { loadTVChart(currentCoinId); }, 100);
  // Load news
  loadNews(currentCoinId);
}

async function loadNews(coinId) {
  var list = document.getElementById('news-list');
  if (!list) return;
  try {
    var resp = await fetch('/api/crypto-news?coin=' + coinId);
    var items = await resp.json();
    if (!items || !items.length) {
      list.innerHTML = '<div class="news-empty">No recent news found.</div>';
      return;
    }
    list.innerHTML = items.map(function(n) {
      var ago = n.datetime ? timeAgo(n.datetime * 1000) : '';
      return '<div class="news-item">'
        + (n.image ? '<img class="news-thumb" src="' + n.image + '" onerror="this.style.display='none'" />' : '')
        + '<div class="news-body">'
        + '<div class="news-hl"><a href="' + n.url + '" target="_blank" rel="noopener">' + n.headline + '</a></div>'
        + '<div class="news-meta">' + (n.source || '') + (ago ? ' · ' + ago : '') + '</div>'
        + '</div></div>';
    }).join('');
  } catch(e) {
    if (list) list.innerHTML = '<div class="news-empty">Could not load news.</div>';
  }
}

function timeAgo(ts) {
  var diff = Date.now() - ts;
  var m = Math.floor(diff / 60000);
  if (m < 60) return m + 'm ago';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

function metBox(label, val, cls) {
  return '<div class="met"><div class="ml">' + label + '</div><div class="mv' + (cls ? ' '+cls : '') + '">' + val + '</div></div>';
}

function statRow(label, val) {
  return '<div class="stat-row"><span class="stat-label">' + label + '</span><span class="stat-val">' + val + '</span></div>';
}

function perfRow(label, val) {
  var abs = Math.abs(val || 0);
  var barW = Math.min(abs * 2, 100);
  var col = val >= 0 ? 'var(--green)' : 'var(--red)';
  var cls = val >= 0 ? 'up' : 'dn';
  return '<div class="perf-row">'
    + '<span class="perf-label">' + label + '</span>'
    + '<div class="perf-bar-wrap"><div class="perf-bar" style="width:' + barW + '%;background:' + col + ';"></div></div>'
    + '<span class="perf-val ' + cls + '">' + fmtPct(val) + '</span>'
    + '</div>';
}

function showNotFound(coinId) {
  document.getElementById('main-content').innerHTML = '<div class="not-found"><h2>⚠ Not found</h2><p style="color:var(--text2);margin-bottom:16px;">Could not find crypto data for "<strong>' + coinId + '</strong>"</p><a href="/" style="color:var(--accent);text-decoration:none;font-weight:600;">← Back to PulseStock</a></div>';
}

function goSearch() {
  var val = document.getElementById('search-input').value.trim().toUpperCase();
  if (!val) return;
  var id = COIN_IDS[val] || val.toLowerCase();
  window.location.href = '/crypto/' + id;
}

// Init
var coinId = window.location.pathname.replace(/\/crypto\/?/, '').replace(/\/+$/, '').toLowerCase().trim();
if (!coinId) { showNotFound('unknown'); }
else { currentCoinId = coinId; loadCoin(coinId); }
</script>
</body>
</html>
